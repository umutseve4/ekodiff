name: patch-issue-3b

on:
  push:
    branches: [wipe-proof]
    paths: ['tools/patch-issue-3b.mjs']

permissions:
  contents: write

jobs:
  patch:
    name: kabul turunu sikilastir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yamayi uygula
        run: node tools/patch-issue-3b.mjs

      - name: Degisiklik ozeti
        run: |
          git --no-pager diff --stat
          git --no-pager diff

      - name: Tek seferlik dosyalari kaldir
        run: rm tools/patch-issue-3b.mjs .github/workflows/patch-issue-3b.yml

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'kabul turu: silme kaniti sikilastirildi' -m 'Tur artik anahtarin kendisinin de silinmesini ve siteyi sadece acmanin depoya hicbir sey yazmamasini sart kosuyor. Iki yeni mutasyon bu iddialarin bos olmadigini kanitliyor.'
          git push
