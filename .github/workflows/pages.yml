name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The site is never published unless the engines and the data behind it
      # pass. A broken curriculum diff is worse than an offline one.
      - name: Run tests before publishing
        run: npm run verify

      # `enablement: true` lets the workflow turn Pages on by itself the first
      # time it runs, instead of failing until someone flips the switch in
      # Settings. If the token is not allowed to, the manual step is still:
      # Settings -> Pages -> Source: GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # `site/` is uploaded verbatim — no build step, so what CI tested is
      # byte-for-byte what visitors receive.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
