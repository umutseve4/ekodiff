name: issue-3 yamasi

# Tek seferlik kosum. tools/patch-issue-3.mjs deponun kendi dosyalari uzerinde
# calisir, sonra hem betik hem de bu is akisi ayni commit icinde silinir.
# Cengellerden biri bile tam olarak bir kez eslesmezse hicbir sey yazilmaz ve
# is kirmizi yanar.

on:
  push:
    branches: [wipe-really-wipes]
    paths:
      - 'tools/patch-issue-3.mjs'

permissions:
  contents: write

jobs:
  patch:
    name: issue #3 yamasini uygula
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Yamayi uygula
        run: node tools/patch-issue-3.mjs

      - name: Degisikligi goster
        run: git --no-pager diff --stat && git --no-pager diff

      - name: Tek seferlik dosyalari kaldir
        run: rm tools/patch-issue-3.mjs .github/workflows/patch-issue-3.yml

      - name: Commit'le ve gonder
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'issue #3: silme artik localStorage anahtarini da kaldirir' \
            -m 'saveTranscript() iki isi birden yapiyordu: kaydetmek ve durum satirini yazmak. Bu yuzden acilista bile depoya "[]" yaziliyor, silme dugmesinden sonra da anahtar geri geliyordu. Kaydetme ile gosterme ayrildi, bos liste artik anahtari siliyor. dom-smoke iki yeni iddia ile bunu her kosumda denetliyor.'
          git push
